name: Build Madreseyar Teacher APK

on:
  workflow_dispatch:
    inputs:
      web_app_url:
        description: "HTTPS address of the live Madreseyar /app/ page"
        required: false
        default: "https://scooljavanrood.ir/app/"
        type: string
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    env:
      WEB_APP_URL: ${{ inputs.web_app_url || vars.WEB_APP_URL || 'https://scooljavanrood.ir/app/' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate secure website URL
        shell: bash
        run: |
          if [[ -z "$WEB_APP_URL" ]]; then
            echo "WEB_APP_URL is missing."
            exit 1
          fi
          if [[ "$WEB_APP_URL" != https://* ]]; then
            echo "Only HTTPS URLs are allowed. HTTP would expose login credentials and session tokens."
            exit 1
          fi
          echo "Building for: ${WEB_APP_URL%%\?*}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -PWEB_APP_URL="$WEB_APP_URL" :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madreseyar-Teacher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
